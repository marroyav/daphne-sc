# NP04 PDS/DAPHNE OPC-UA bridge example.
#
# Run on np04-onl-004.CERN.CH after confirming the DAPHNE endpoint and USB
# supply device path. Values here are intentionally conservative.

opcua.endpoint = opc.tcp://0.0.0.0:4840
poll.period_ms = 1000

daphne.enabled = true
daphne.fake = false
daphne.endpoint = tcp://NP04-DAPHNE-015.CERN.CH:40001
daphne.route = mezz/0
daphne.timeout_ms = 750

power.enabled = true
power.fake = false
power.device = auto
power.timeout_ms = 750
power.serial_baud = 9600

# Hardware writes are disabled until limits are reviewed for the connected
# supply and load. Monitoring works with writes disabled.
power.writes_enabled = false
power.voltage_min_v = 0.0
power.voltage_max_v = 0.0
power.current_min_a = 0.0
power.current_max_a = 0.0
