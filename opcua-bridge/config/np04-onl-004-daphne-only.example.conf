# NP04 ONL bridge profile for keeping OPC-UA responsive while the USBTMC
# power-supply path is being debugged.

opcua.endpoint = opc.tcp://0.0.0.0:4840
poll.period_ms = 1000

daphne.enabled = true
daphne.fake = false
daphne.endpoint = tcp://NP04-DAPHNE-015.CERN.CH:40001
daphne.route = mezz/0
daphne.timeout_ms = 750

power.enabled = false
power.fake = true
power.device = auto
power.timeout_ms = 750
power.serial_baud = 9600
power.writes_enabled = false
power.voltage_min_v = 0.0
power.voltage_max_v = 0.0
power.current_min_a = 0.0
power.current_max_a = 0.0
