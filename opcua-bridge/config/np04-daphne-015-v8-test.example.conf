# Reversible v8 end-to-end test against the read-only DAPHNE-015 telemetry
# sidecar. Run on np04-onl-004. Ports 40002 and 4842 intentionally avoid the
# production/default services. All DAPHNE and power-supply writes remain
# disabled.

opcua.endpoint = opc.tcp://0.0.0.0:4842
opcua.allow_anonymous_read = true
poll.period_ms = 1000

daphne.enabled = true
daphne.fake = false
daphne.writes_enabled = false
daphne.ids = 015
daphne.015.endpoint = tcp://NP04-DAPHNE-015.CERN.CH:40002
daphne.015.route = mezz/0
daphne.timeout_ms = 1000
daphne.worker_count = 1

power.enabled = false
power.fake = true
power.writes_enabled = false
power.device = auto
power.timeout_ms = 750
power.serial_baud = 9600
power.voltage_min_v = 0.0
power.voltage_max_v = 0.0
power.current_min_a = 0.0
power.current_max_a = 0.0

# These files are exported from the proposed-v8 daphne-icd workbook.
registry.tag_list_file = contract/tag_list.csv
registry.expected_patterns = 383
registry.maximum_nodes = 5000
registry.namespace_version = v8-draft-2026-08-18
registry.stale_after_ms = 5000
control.policy_file = contract/opc_ua_control_policy.csv

# DAPHNE-015 is an HD endpoint. Instance lists are explicit so a VD profile can
# select channels 0..31 without publishing absent hardware.
registry.instances.Afe = 0..4
registry.instances.Channel = 0..39
registry.instances.Fan = 0..1
registry.instances.Interface = eth0
registry.instances.DataLink = 0..3
registry.instances.Sfp = timing, ccm, data0, data1, data2, data3
registry.instances.Bus = 1, 2
registry.instances.Address = 0x10, 0x17, 0x12, 0x16, 0x32, 0x36, 0x70, 0x71, 0x72
registry.instances.Device = spidev3.0
registry.instances.Rail = 3VD3, 2VA1, 3VA6, 1VD8
registry.instances.Sensor = soc, carrier
registry.instances.Service = firmware.service, clockchip.service, endpoint.service, hermes.service, daphne.service, daphne-boot-ok.service, rpu
registry.i2c_devices = 1:0x10, 1:0x17, 2:0x12, 2:0x16, 2:0x32, 2:0x36, 2:0x70, 2:0x71, 2:0x72
